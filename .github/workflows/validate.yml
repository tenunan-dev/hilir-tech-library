# Manual only (2026-11-16): GitHub is repo storage, not the pipeline. Nothing here may run on a
# push — that spends the owner's exhausted Actions quota to repeat a check `pytest -q` already
# runs locally. Trigger by hand from the Actions tab only if a second opinion is ever wanted.
name: Validate catalog
on:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-collect.txt -r requirements-agent.txt pytest
      - run: python tools/build.py
      - run: python agent/library.py build
      - run: pytest -q tests
      - name: Generated files are up to date
        run: git diff --exit-code catalog/
