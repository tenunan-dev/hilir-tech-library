# SUPERSEDED 2026-11-16 — images no longer build in CI and ghcr.io is not in the deploy path.
# GitHub is repo storage only (owner's Actions quota is exhausted). Images are now built locally
# for linux/amd64 and streamed straight into the VPS: see deploy/local-images.sh.
#
# This file is kept, manual-trigger only, as the reference recipe (it is the one place that shows
# both Dockerfiles + the platform/cache flags). Running it pushes to ghcr.io and spends quota —
# do not, unless the owner explicitly asks for a registry build again.
#
# The 4 GB VPS must never build these: both images bake the corpus and warm the fastembed model.
name: images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ghcr.io/tenunan-dev/hilir-tech-library-ui
            dockerfile: deploy/docker/Dockerfile.frontend
          - image: ghcr.io/tenunan-dev/hilir-tech-library-api
            dockerfile: deploy/docker/Dockerfile.backend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
