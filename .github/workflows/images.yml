# Phase 3 (PLAN.md / VPS-COMPUTE.md): container images build in CI, never on
# the VPS. Both split images (Dockerfile.frontend = UI, Dockerfile.backend =
# API) bake the corpus and warm the fastembed model, so they are large —
# GitHub runners handle that; the 4 GB VPS must never try.
#
# Trigger: manual (workflow_dispatch) or a version tag (v*). Every run pushes
# :latest plus a ref tag (branch or tag name). Images are PRIVATE on ghcr.io;
# the VPS pulls with a read-only PAT.
name: images

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ghcr.io/tenunan-dev/hilir-tech-library-ui
            dockerfile: deploy/docker/Dockerfile.frontend
          - image: ghcr.io/tenunan-dev/hilir-tech-library-api
            dockerfile: deploy/docker/Dockerfile.backend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
